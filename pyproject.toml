[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xarchive"
version = "0.1.0"
description = "Local-first X (Twitter) archive tool: import the official ZIP, search, mark, and bulk-delete via the official API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Don J. Rude" }]
keywords = ["twitter", "x", "archive", "local-first"]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xarchive = "xarchive.cli:entry"

[project.urls]
Homepage = "https://github.com/RudeDude/xarchive"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
